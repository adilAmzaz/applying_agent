<style>

</style></head><body>
<input aria-label="Rechercher" value="AI engineer"><input aria-label="Lieu" value="France">
<div id="list"><ul>
 <li data-occludable-job-id="3900000001"><div class="job-card-container" data-job-id="3900000001">

   <div class="artdeco-entity-lockup__subtitle">ACME</div>

   <div class="job-card-container__footer-item">Candidature simplifiée</div></div></li>
 <li data-occludable-job-id="3900000002"><div class="job-card-container" data-job-id="3900000002">
   <a class="job-card-container__link" href="/jobs/view/3900000002/"><strong>GenAI Engineer</strong></a>
   <div class="artdeco-entity-lockup__subtitle">Delta</div>

 <li data-occludable-job-id="3900000005" id="late"></li>
</ul></div>
<script>
 // like LinkedIn: the last card is only rendered once the list is scrolled
 document.getElementById('list').addEventListener('scroll', e => {
   const late = document.getElementById('late');
   if (e.target.scrollTop > 150 && !late.innerHTML)
     late.innerHTML = '<div class="job-card-container" data-job-id="3900000005"><a class="job-card-container__link" ' +
       'href="/jobs/view/3900000005/"><strong>ML Engineer</strong></a><div class="artdeco-entity-lockup__subtitle">Epsilon</div></div>';
 });
</script></body></html>
